<div class="avisos-container">
  <div class="header">
    <h2>Avisos del Consorcio</h2>
    <p>Mantenete al tanto de las novedades importantes.</p>
  </div>

  <div class="avisos-grid">
    @for(aviso of avisos; track aviso.id){
      <div class="aviso-card" [class.prioridad-alta]="aviso.prioridad === 'Alta'">
        <div class="icono">
          <i [class]="aviso.icono"></i>
        </div>
        <div class="contenido">
          <div class="meta">
            <h3>{{aviso.titulo}}</h3>
            <span class="fecha">{{aviso.fecha}}</span>
          </div>
          <p>{{aviso.descripcion}}</p>
        </div>
        <button class="btn-check" (click)="marcarComoLeido(aviso)">
          <i class="bi bi-check2-circle"></i>
        </button>
      </div>
    }
  </div>
</div>
