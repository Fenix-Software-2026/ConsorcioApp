<div class="configuracion-container">
  <h2>Mi Configuración</h2>

  <div class="config-grid">
    <div class="perfil-card">
      <div class="campo"><label>Usuario</label>
        <h3>{{residente()?.username}}</h3>
      </div>
      <br>
      <div class="form-row">
        <div class="campo"><label>Unidad</label>
          <p class="texto-dato">{{residente()?.unidad_detalle?.piso}}-{{residente()?.unidad_detalle?.departamento}}</p>
        </div>
        <div class="campo"><label>Email</label>
          <p class="texto-dato">{{ residente()?.email }}</p>
        </div>
      </div>
    </div>

    <div class="config-card">
      <h3 class="subtitulo">Seguridad</h3>
    <form [formGroup]="passwordForm" (ngSubmit)="guardarPerfil()">
    
      <div class="campo">
        <label>Contraseña Actual</label>
        <input type="password" formControlName="contraseñaActual">
      </div>
    
      <div class="campo">
        <label>Nueva Contraseña</label>
        <input type="password" formControlName="contraseñaNueva">
      </div>
    
      <div class="campo">
        <label>Confirmar Nueva Contraseña</label>
        <input type="password" formControlName="confirmarContraseña">
    
        @if (passwordForm.hasError('noCoinciden') && passwordForm.get('confirmarContraseña')?.touched) {
        <small style="color: red;">Las contraseñas no coinciden.</small>
        }
      </div>
    
      <button class="guardar-btn"  type="submit" [disabled]="passwordForm.invalid">Guardar Contraseña</button>
    </form>
      </div>

    </div>
  </div>
